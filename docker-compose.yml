services:
  neo4j:
    image: neo4j:5-community
    container_name: nexusdocs-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-nexusdocs}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexusdocs-api
    environment:
      - NEXUSDOCS_REPOSITORY_BACKEND=${REPOSITORY_BACKEND:-neo4j}
      - NEXUSDOCS_NEO4J_URI=bolt://neo4j:7687
      - NEXUSDOCS_NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEXUSDOCS_NEO4J_PASSWORD=${NEO4J_PASSWORD:-nexusdocs}
      - NEXUSDOCS_NEO4J_DATABASE=neo4j
      - NEXUSDOCS_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NEXUSDOCS_OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - NEXUSDOCS_OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - NEXUSDOCS_API_CORS_ORIGINS=["*"]
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/healthz\")'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexusdocs-seed
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Override at the CLI: `SEED_FILE=examples/payments-sample.yaml make seed`
      - SEED_FILE=${SEED_FILE:-/examples/large-acme-corp.yaml}
    entrypoint: ["sh", "-lc"]
    command:
      - >-
        echo "seeding from $$SEED_FILE" &&
        curl -fsS -X POST
        -H 'Content-Type: text/yaml'
        --data-binary @"$$SEED_FILE"
        http://api:8080/api/v1/definitions/apply
        > /tmp/seed-result.json
        && echo
        && echo 'seeded'
    restart: "no"

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nexusdocs-ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  neo4j-data: {}
  neo4j-logs: {}
