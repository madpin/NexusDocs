kind: DocFragment
spec:
  id: docfrag.kafka-throughput-ceiling
  title: "Kafka publisher throughput ceiling"
  body: |
    `core-kafka-prod` is sized for ~50k msgs/sec aggregate. Individual
    topics are capped at 8k msgs/sec by the cluster-wide quota. If you
    need more, request a partition rebalance from team-platform-data.
  subjects:
    - entity: kafka_cluster.core-kafka-prod
  tags: [kafka, platform-standards, throughput]
  coverage:
