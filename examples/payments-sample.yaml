kind: DocFragment
spec:
  id: docfrag.payments-auth-failure-mode
  title: "Failure modes: Payments → Auth REST"
  body: |
    Auth Service rate-limits to 500 req/s per consumer. Circuit breaker
    trips after 3 consecutive 429s and opens for 30s. On a 401, the token
    is stale — refresh via `/oauth/refresh` before retrying.
  relations:
