[project]
name = "nexusdocs"
version = "0.1.0"
description = "Topology-aware knowledge graph documentation platform"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "../LICENSE" }
authors = [{ name = "Thiago M Pinto" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "networkx>=3.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "structlog>=24.1",
    "rapidfuzz>=3.9",
    "neo4j>=5.20",
    "openai>=1.30",
    "anyio>=4.4",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
nexdoc = "nexusdocs.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusdocs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "neo4j: requires a running Neo4j instance",
    "openai: requires OPENAI_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# E501 is enforced by formatter; B008 is the idiomatic FastAPI `Depends(...)` default;
# B904 / B017 fire heavily on test code where bare `raise` and `pytest.raises(Exception)`
# are intentional. We keep the rest of B/UP/RUF on.
ignore = ["E501", "B008", "B904", "B017"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately import-and-discard via `import nexusdocs as _`. Silence the
# unused-import noise so the CI gate stays meaningful.
"tests/**/*.py" = ["F401", "F841"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "basic"
